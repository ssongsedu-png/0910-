<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0f"><title>프로토콜 13 — 미스터리 방탈출</title><style>
:root{color-scheme:dark;--bg:#080b0f;--card:#121920;--line:#29343b;--text:#edf5f2;--muted:#91a19e;--mint:#75efcc;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;color:var(--text);background:radial-gradient(circle at 50% 12%,#123028 0,transparent 32rem),var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px}.top{position:relative;width:min(100% - 28px,1000px);margin:auto;padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em}.logo{display:grid;place-items:center;width:35px;height:35px;border:1px solid #75efcc88;border-radius:10px;color:var(--mint);font:800 .7rem monospace}.stats{display:flex;gap:8px}.stat{padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1217cc}.stat span{display:block;color:var(--muted);font-size:.68rem}.stat strong{display:block;margin-top:3px;font-size:.9rem}.stat em{color:var(--mint);font-style:normal}main{position:relative;width:min(100% - 28px,700px);margin:auto;padding:15px 0 35px}.status{display:flex;align-items:center;gap:9px;margin:0 0 12px 5px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red);animation:pulse 2s infinite}.card{min-height:480px;padding:clamp(25px,6vw,48px);display:flex;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#192229f7,#10161bf7);box-shadow:0 35px 90px #0007}.scene{flex:1;display:flex;flex-direction:column;transition:.18s}.scene.out{opacity:0;transform:translateY(8px)}.scene.in{animation:enter .35s}.label{margin:0 0 27px;color:var(--mint);font:800 .72rem monospace;letter-spacing:.14em}.label:before{content:"// ";color:var(--muted)}h1,h2{margin:0;letter-spacing:-.045em;line-height:1.2}h1{font-size:clamp(1.8rem,6vw,2.8rem)}h2{font-size:clamp(1.65rem,5vw,2.3rem)}.copy{color:#b7c5c1;font-size:1.05rem;line-height:1.85;word-break:keep-all}.copy strong{color:var(--text)}.choices{display:grid;gap:10px;margin-top:auto;padding-top:30px}.choice,.restart{min-height:57px;border-radius:14px;font:700 .96rem inherit;cursor:pointer}.choice{padding:12px 15px;display:grid;grid-template-columns:31px 1fr 20px;align-items:center;gap:10px;color:var(--text);border:1px solid var(--line);background:#080d1188;text-align:left;transition:.16s}.choice:hover{transform:translateX(3px);border-color:#75efcc88;background:#75efcc0d}.num{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;color:var(--mint);font:800 .75rem monospace}.arrow{color:var(--muted)}.choice:focus-visible,.restart:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.badge{width:max-content;margin-bottom:20px;padding:7px 10px;border:1px solid;border-radius:99px;color:var(--mint);font-size:.68rem;font-weight:900;letter-spacing:.12em}.badge.bad{color:var(--red)}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}.result div{padding:15px;border:1px solid var(--line);border-radius:13px;background:#060a0d55}.result span{display:block;color:var(--muted);font-size:.72rem}.result strong{display:block;margin-top:5px}.restart{width:100%;border:0;color:#06221c;background:var(--mint);font-weight:900}footer{position:relative;padding:0 15px 22px;color:#53605d;font-size:.67rem;letter-spacing:.12em;text-align:center}@keyframes pulse{50%{opacity:.4}}@keyframes enter{from{opacity:0;transform:translateY(-7px)}}@media(max-width:520px){.top{align-items:flex-start}.brand{font-size:.8rem}.stat{padding:7px 8px}.stat span{font-size:.58rem}.stat strong{font-size:.76rem}.card{min-height:530px;border-radius:20px}.result{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><header class="top"><div class="brand"><b class="logo">P13</b>프로토콜 13</div><div class="stats"><div class="stat"><span>최소 선택 기록</span><strong id="best"><em>—</em></strong></div><div class="stat"><span>찾아낸 엔딩 수</span><strong id="found"><em>0</em> / 5</strong></div></div></header><main><p class="status"><i class="dot"></i><span id="status">보안 봉쇄 진행 중</span></p><article class="card" aria-live="polite"><div class="scene" id="scene"></div></article></main><footer>SUBJECT 07 · MEMORY STATUS UNKNOWN</footer><script>
(()=>{'use strict';const K='protocol13-records-v1',TOTAL=5;const S={
start:{l:'SCENE 01 / AWAKENING',t:'차가운 바닥 위에서 눈을 떴다.',p:'어두운 연구실에서 깨어났다. 책상 위에 <strong>열쇠</strong>가 있고 앞에는 굳게 닫힌 <strong>철문</strong>이 있다.',c:[['열쇠를 줍는다','key'],['철문을 밀어본다','door'],['주변을 먼저 살펴본다','room']]},
key:{l:'SCENE 02 / THE KEY',t:'열쇠에는 숫자 13이 새겨져 있다.',p:'철문에는 열쇠 구멍이 없다. 대신 책상 아래 서랍과 벽의 제어반이 눈에 들어온다.',c:[['서랍에 열쇠를 사용한다','drawer'],['제어반을 조사한다','panel'],['열쇠를 문에 가져간다','lock']]},
door:{l:'SCENE 02 / SEALED DOOR',t:'철문은 꿈쩍도 하지 않는다.',p:'붉은 센서가 깜빡이며 말한다. <strong>“피험자 확인. 탈출 절차를 개시합니다.”</strong>',c:[['센서에 손을 댄다','scan'],['책상으로 돌아간다','key'],['스피커에 말을 건다','voice']]},
room:{l:'SCENE 02 / OBSERVATION',t:'이곳은 연구실이 아니라 관찰실이다.',p:'한쪽 벽은 단방향 거울이다. 바닥의 화살표는 환기구를, 찢긴 메모는 벽 아래 전선을 가리킨다.',c:[['찢긴 메모를 읽는다','note'],['환기구를 연다','vent'],['거울을 두드린다','mirror']]},
drawer:{l:'SCENE 03 / DRAWER 13',t:'서랍 안에는 신분증과 주사기가 있다.',p:'신분증 사진은 당신이다. 이름 대신 <strong>“연구 책임자 윤서진”</strong>이라고 적혀 있다.',c:[['기억 회복제를 주사한다','memory'],['신분증을 제어반에 댄다','admin']]},
panel:{l:'SCENE 03 / CONTROL PANEL',t:'제어반이 세 자리 코드를 요구한다.',p:'힌트는 <strong>“열쇠의 수, 피험자 번호, 깨어난 시각”</strong>이다.',c:[['13 · 07 · 17을 입력한다','access'],['07 · 13 · 03을 입력한다','wrong']]},
lock:{l:'SCENE 03 / FALSE LOCK',t:'열쇠가 문 중앙에 자석처럼 붙었다.',p:'문 옆에 <strong>눈 모양</strong>과 <strong>폐 모양</strong> 두 개의 표시가 나타났다.',c:[['눈 모양을 누른다','eye'],['폐 모양을 누른다','gas']]},
scan:{l:'SCENE 03 / BIOMETRIC',t:'센서가 당신을 관리자로 인식했다.',p:'철문이 반쯤 열리고 흰 복도가 보인다. 뒤에서는 카운트다운이 시작된다.',c:[['복도로 뛰어든다','hall'],['방을 더 조사한다','server']]},
voice:{l:'SCENE 03 / THE VOICE',t:'스피커 너머의 목소리는 당신과 같다.',p:'“거울 뒤의 내가 진짜인지, 방 안의 네가 진짜인지 확인해 봐.”',c:[['거울을 깨뜨린다','camera'],['목소리를 무시한다','key']]},
note:{l:'SCENE 03 / TORN NOTE',t:'메모 한 줄이 이어진다.',p:'<strong>“환기구는 탈출구가 아니다. 파란 전선을 먼저 끊어라.”</strong>',c:[['파란 전선을 끊는다','power'],['빨간 전선을 끊는다','wrong']]},
vent:{l:'SCENE 03 / AIR DUCT',t:'환기구 너머에서 바람이 불어온다.',p:'벽에는 누군가 <strong>“빛을 따라가지 마”</strong>라고 긁어 놓았다.',c:[['어두운 통로로 간다','tunnel'],['푸른 불빛을 따라간다','clone']]},
mirror:{l:'SCENE 03 / GLASS',t:'거울 너머에서 세 번 두드린다.',p:'유리에 손글씨가 나타난다. <strong>“나는 네가 아니다.”</strong>',c:[['거울을 깨뜨린다','camera'],['똑같이 세 번 두드린다','hall']]},
memory:{l:'SCENE 04 / RECOVERY',t:'기억이 번개처럼 돌아온다.',p:'당신은 이 실험의 책임자였다. 비상 탈출 코드는 <strong>13-07-17</strong>이다.',c:[['비상 코드를 입력한다','access'],['기억 초기화를 누른다','reset']]},
admin:{l:'SCENE 04 / ADMIN',t:'봉쇄 해제 권한이 승인되었다.',p:'화면에는 시설 봉쇄 해제와 피험자 초기화 명령이 떠 있다.',c:[['시설 봉쇄를 해제한다','dawn'],['피험자를 초기화한다','reset']]},
access:{l:'SCENE 04 / ACCESS',t:'정답이다. 문이 열리기 시작한다.',p:'기록에는 이번이 <strong>13번째 탈출 시도</strong>라고 적혀 있다.',c:[['지상 출구로 달린다','dawn'],['기록 보관실로 간다','archive']]},
wrong:{l:'SCENE 04 / DENIED',t:'경고등이 붉게 변한다.',p:'천장의 노즐이 열리고 달콤한 냄새가 퍼진다. 비상 환기 레버가 보인다.',c:[['환기 레버를 당긴다','server'],['문을 억지로 연다','gas']]},
eye:{l:'SCENE 04 / OBSERVER',t:'거울 너머에 같은 방 열두 개가 보인다.',p:'모든 방 안의 “당신”이 동시에 이쪽을 바라본다.',c:[['비상구로 달린다','dawn'],['진실을 기록한다','archive']]},
hall:{l:'SCENE 04 / WHITE HALL',t:'복도 끝에 두 개의 문이 있다.',p:'왼쪽에는 <strong>EXIT</strong>, 오른쪽에는 당신의 이름이 적혀 있다.',c:[['EXIT로 나간다','dawn'],['이름이 적힌 문을 연다','archive']]},
server:{l:'SCENE 04 / CONTAINMENT',t:'바닥 아래 정비 통로가 열렸다.',p:'지상으로 향하는 사다리와 붉게 빛나는 중앙 서버가 보인다.',c:[['사다리를 올라간다','dawn'],['서버를 정지시킨다','archive']]},
camera:{l:'SCENE 04 / SHATTERED',t:'거울은 유리가 아니라 화면이었다.',p:'영상 속 당신은 매번 같은 선택을 반복한다.',c:[['실험 기록을 삭제한다','archive'],['처음부터 다시 재생한다','reset']]},
power:{l:'SCENE 04 / POWER CUT',t:'전자 잠금이 풀렸다.',p:'철문과 정비 통로가 동시에 열렸다.',c:[['철문을 밀고 나간다','dawn'],['정비 통로로 내려간다','archive']]},
tunnel:{l:'SCENE 04 / DARK ROUTE',t:'어둠 끝에서 새벽 공기가 느껴진다.',p:'위에서는 빗소리가, 아래에서는 서버의 진동이 전해진다.',c:[['빗소리를 따라간다','dawn'],['서버실로 내려간다','archive']]},
clone:{l:'SCENE 04 / BLUE ROOM',t:'푸른빛은 배양 캡슐이었다.',p:'캡슐 안에는 당신과 똑같은 사람이 잠들어 있다.',c:[['캡슐을 연다','specimen'],['어두운 통로로 돌아간다','tunnel']]},
dawn:{e:1,k:'good',n:'새벽의 생존자',t:'마침내 차가운 새벽 공기를 마셨다.',p:'철문 밖은 비 내리는 산속이었다. <strong>이번에는 기억을 잃지 않았다.</strong>'},archive:{e:1,k:'good',n:'진실의 기록자',t:'탈출보다 먼저 진실을 세상에 보냈다.',p:'모든 실험 기록을 외부로 전송했다. <strong>13번의 실패는 이제 증거가 되었다.</strong>'},reset:{e:1,k:'bad',n:'열세 번째 반복',t:'기억이 다시 지워졌다.',p:'“피험자 07, 탈출 절차를 개시합니다.”'},specimen:{e:1,k:'bad',n:'교체된 피험자',t:'캡슐 속 존재가 먼저 눈을 떴다.',p:'또 다른 당신은 걸어 나갔다. <strong>“복제본 보관 완료.”</strong>'},gas:{e:1,k:'bad',n:'잠든 피험자',t:'달콤한 안개 속에서 눈을 감았다.',p:'<strong>“13번째 실험, 실패. 기억 초기화를 시작합니다.”</strong>'}};
const scene=document.querySelector('#scene'),best=document.querySelector('#best'),found=document.querySelector('#found'),status=document.querySelector('#status');let count=0,lock=0;const records=()=>{try{return JSON.parse(localStorage.getItem(K))||{best:null,endings:[]}}catch{return{best:null,endings:[]}}},save=r=>{try{localStorage.setItem(K,JSON.stringify(r))}catch{}},head=()=>{let r=records();best.innerHTML=r.best==null?'<em>—</em>':`<em>${r.best}</em>회`;found.innerHTML=`<em>${r.endings.length}</em> / ${TOTAL}`};function render(id){let n=S[id];if(n.e){let r=records();r.best=r.best==null?count:Math.min(r.best,count);r.endings=r.endings||[];if(!r.endings.includes(n.n))r.endings.push(n.n);save(r);head();status.textContent=n.k==='good'?'봉쇄 해제 · 생존 확인':'신호 소실 · 실험 종료';scene.innerHTML=`<div class="badge ${n.k==='bad'?'bad':''}">${n.k==='good'?'ESCAPE SUCCESS':'BAD ENDING'}</div><h2>${n.t}</h2><p class="copy">${n.p}</p><div class="result"><div><span>선택한 횟수</span><strong>${count}회</strong></div><div><span>도달한 엔딩 이름</span><strong>${n.n}</strong></div></div><button class="restart">처음부터 다시하기</button>`;scene.querySelector('button').onclick=()=>go('start',true);return}status.textContent='보안 봉쇄 진행 중';scene.innerHTML=`<p class="label">${n.l}</p><h1${id==='start'?' style="font-size:15px"':''}>${n.t}</h1><p class="copy">${n.p}</p><div class="choices">${n.c.map((x,i)=>`<button class="choice" data-i="${i}"><span class="num">0${i+1}</span><span>${x[0]}</span><span class="arrow">→</span></button>`).join('')}</div>`;scene.querySelectorAll('button').forEach(b=>b.onclick=()=>go(n.c[+b.dataset.i][1]))}function go(id,restart){if(lock)return;lock=1;if(restart)count=0;else count++;scene.classList.add('out');setTimeout(()=>{render(id);scene.className='scene in';lock=0},180)}document.addEventListener('keydown',e=>{let b=scene.querySelectorAll('.choice')[+e.key-1];if(b&&!lock)b.click()});head();render('start')})();
</script></body></html>
